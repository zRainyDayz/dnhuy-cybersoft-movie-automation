name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      # Stable suite must be green; known-bug tests are run separately and are expected to fail
      - name: Stable suite
        run: npx playwright test --grep-invert @bug
      - name: Known-bug suite (expected failures, evidence only)
        if: always()
        continue-on-error: true
        run: npx playwright test --grep @bug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-evidence
          path: |
            reports/
            screenshots/
            logs/
            test-results/
          retention-days: 14
